name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Playwright collection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Collect Playwright tests
        if: always()
        run: npm run pw:test:list > playwright-test-list.txt 2>&1

      - name: Upload Playwright test list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-list-${{ github.run_id }}
          path: playwright-test-list.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
